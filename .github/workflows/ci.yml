name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, contract and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check (Biome)
        run: npm run format:check

      # PROTECTED_MANIFEST_SHA256 is a repository variable that only admins can
      # edit. When set, scripts/protected-files.json must match it, so a
      # re-snapshot committed by the external team fails here even before review.
      - name: Contract check
        run: npm run check:contract
        env:
          PROTECTED_MANIFEST_SHA256: ${{ vars.PROTECTED_MANIFEST_SHA256 }}

      - name: Build (offline, bundled sample data)
        run: npm run build
